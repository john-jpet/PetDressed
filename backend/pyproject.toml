[project]
name = "petdressed-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.34,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "ortools>=9.11,<10",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.4,<3",
  "pillow>=10.4,<12",
  "pgvector>=0.3,<1",
  "pyjwt[crypto]>=2.9,<3",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]
cv = [
  "torch>=2.5.1,<3",
  "torchvision>=0.20.1,<1",
  "transformers>=4.57,<6",
  "huggingface-hub>=0.34,<2",
]
cuda = [
  "torch>=2.5.1,<3",
  "torchvision>=0.20.1,<1",
  "transformers>=4.57,<6",
  "huggingface-hub>=0.34,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["B008"]
